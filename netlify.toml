[[headers]]
  # CORS for all paths
  for = "/*"

  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

# Per-surah tafsir files (/{edition}/{surah}.json) can be re-processed and
# rewritten IN PLACE at the same URLs (corrections, re-imports), so they are
# NOT immutable. `immutable` would freeze stale copies in browsers' HTTP disk
# cache for a year, which a clear-site-data reset does not evict. Use a freshness
# window instead: trust the local copy for 1 day, then serve it instantly for up
# to a year while revalidating in the background. Netlify ETags make those
# conditional GETs that return a tiny 304 (no re-download) unless the file
# actually changed, so unchanged bytes are essentially never re-downloaded and a
# returning visitor effectively never waits on a blocking revalidation.
[[headers]]
  for = "/*/*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=31536000"

# Editions index updates when new tafsirs are added — short cache so
# additions propagate quickly. MUST be AFTER the /*/*.json rule because
# Netlify's glob treats `*` as "anything including empty", so /*/*.json
# also matches /editions.json; later rule wins for overlapping headers.
[[headers]]
  for = "/editions.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
